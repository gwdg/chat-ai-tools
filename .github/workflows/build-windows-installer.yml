name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build standalone MCP executable
        run: npm run build:windows

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\windows\installer.iss'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-folder-mcp-windows
          path: |
            build/windows/out/local-folder-mcp.exe
            build/windows/out/local-folder-mcp-setup.exe
